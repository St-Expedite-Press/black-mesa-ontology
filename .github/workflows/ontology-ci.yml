name: Ontology CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install rdflib pyshacl owlrl pytest pyyaml markdown jinja2 jsonschema
      - name: Validate ontology
        run: python tools/validate_ontology.py schema/*.ttl --shapes schema/shapes.ttl
      - name: Check documentation
        run: python tools/check_docs.py
      - name: Run tests
        run: python -m pytest tests/ -q
